<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- core / nucleus -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="800" cy="200" r="150" fill="url(#glow)" opacity="0.5"/>
  <circle cx="800" cy="200" r="46" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="800" cy="200" r="13" fill="url(#accent)"/>

  <!-- orbiting electrons (phases) -->
  <ellipse cx="800" cy="200" rx="150" ry="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 8" transform="rotate(-20 800 200)"/>
  <ellipse cx="800" cy="200" rx="150" ry="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 8" transform="rotate(40 800 200)"/>
  <circle cx="665" cy="140" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
  <circle cx="910" cy="265" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="925" cy="140" r="22" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="680" cy="265" r="22" fill="#0f172a" stroke="#34d399" stroke-width="3"/>

  <text x="663" y="146" fill="#c7d2fe" font-family="monospace" font-size="20" text-anchor="middle">grill</text>
  <text x="910" y="266" fill="#c7d2fe" font-family="monospace" font-size="16" text-anchor="middle">load</text>
  <text x="925" y="146" fill="#c7d2fe" font-family="monospace" font-size="15" text-anchor="middle">wayfind</text>
  <text x="682" y="266" fill="#c7d2fe" font-family="monospace" font-size="13" text-anchor="middle">orch</text>

  <text x="800" y="120" fill="#e2e8f0" font-family="monospace" font-size="64" font-weight="700" text-anchor="middle">nucleus</text>
  <text x="800" y="155" fill="#818cf8" font-family="sans-serif" font-size="22" letter-spacing="8" text-anchor="middle">KICKOFF→ORCHESTRATION</text>
  <text x="800" y="320" fill="#94a3b8" font-family="sans-serif" font-size="17" text-anchor="middle">Grill the user · chart a wayfinder · load skills · spin up a subagent DAG · self-improve</text>
</svg>